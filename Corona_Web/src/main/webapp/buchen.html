<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Termin Buchen</title>
    <link rel="stylesheet" type="text/css" href="login-registration.css">
    <link rel="stylesheet" type="text/css" href="buchen.css">
</head>
<body>

<div class="upper">

    <h1>Termin Buchung</h1>

</div>

<div class="upper-nav">
    <nav>
        <a href="listtermine.html">Termin ansehen</a>
        <a href="#" class="active">Termine Buchen</a>
        <a href="logout" class="roll">Abmelden</a>

    </nav>
</div>

    <div class="container">
        <div class="up">
            <button id="leftup" value="go">Für Mich</button>
            <button id="rightup" value="get">Für Andere</button>

        </div><br>
        <form action="BuchenServlet" method="post">

            <div id="extrainfo" style="display:none">

            <label for="vname">Vorname</label><br>
            <input type="text" name="vname" id="vname"  class="input"><br>

            <label for="nname">Nachname</label><br>
            <input type="text" name="nname" id="nname"  class="input"><br>

                <label for="address">Addresse</label><br>
                <input type="text" name="address" id="address"  class="input"><br>

            </div>

            <label for="ort">Standort:</label>
            <select id="ort" name="ort" required class="input" onchange="getVaccinesAndTimeSlots(this.value)" >
                <!-- Weitere Standorte hier einfügen -->
            </select>

            <label for="impfung">Impfstoff</label><br>
            <select id="impfung" name="impfung" required class="input">
                <option value="">Bitte wählen</option>
            </select><br>

            <label for="date">Termin Datum</label><br>
            <input type="date" id="date" name="date" required class="input"><br>

            <label for="zeit">Uhrzeit</label><br>
            <select id="zeit" name="zeit"  required class="input">
                <option value="">Bitte wählen</option>
            </select>
            <br>
            <button type="submit" value="Buchen">Buchen</button>
        </form>
    </div>
<script type="text/javascript" src="buchen.js"></script>
</body>
</html>
